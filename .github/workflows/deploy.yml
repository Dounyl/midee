name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    environment: aliyun jonny

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Setup SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Verify SSH access
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "echo deploy-ssh-ok"

      - name: Verify deployment directory
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          printf -v quoted_path '%q' "$DEPLOY_PATH"
          ssh \
            -i ~/.ssh/deploy_key \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -s -- $quoted_path" <<'REMOTE'
          set -eu
          target=$1
          case "$target" in
            ''|/|/var|/var/www|/etc|/usr|/home|/tmp)
              echo "Refusing unsafe deployment directory: $target" >&2
              exit 1
              ;;
            /*) ;;
            *) echo "Deployment directory must be absolute: $target" >&2; exit 1 ;;
          esac
          parent=$(dirname -- "$target")
          if [ -d "$target" ] && [ -w "$target" ]; then
            echo "Deployment directory is writable: $target"
            exit 0
          fi
          if [ ! -e "$target" ] && [ -d "$parent" ] && [ -w "$parent" ]; then
            echo "Deployment directory can be created: $target"
            exit 0
          fi
          echo "Deployment user cannot write to $target. Check DEPLOY_PATH and site ownership." >&2
          id
          ls -ld -- "$parent" "$target" 2>/dev/null || true
          # Show only routing directives for this site, never full server config.
          for config in /etc/nginx/nginx.conf /etc/nginx/sites-enabled/* /etc/nginx/conf.d/*.conf; do
            [ -r "$config" ] || continue
            if grep -Eq 'midora[.]top|midee' "$config" || [ "$(basename -- "$config")" = default ]; then
              echo "Site configuration: $config"
              grep -En '^[[:space:]]*(server_name|root|alias)[[:space:]]' "$config" || true
            fi
          done
          exit 1
          REMOTE

      - name: Package dist
        run: tar -czf /tmp/midee-dist.tar.gz -C dist .

      - name: Replace dist on server
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          if [ -z "$DEPLOY_PATH" ] || [ "$DEPLOY_PATH" = "/" ]; then
            echo "Refusing to deploy to unsafe DEPLOY_PATH: $DEPLOY_PATH"
            exit 1
          fi
          scp \
            -i ~/.ssh/deploy_key \
            -P "$DEPLOY_PORT" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            /tmp/midee-dist.tar.gz \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/midee-dist.tar.gz"
          ssh \
            -i ~/.ssh/deploy_key \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p \"$DEPLOY_PATH\" && find \"$DEPLOY_PATH\" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} + && tar -xzf /tmp/midee-dist.tar.gz -C \"$DEPLOY_PATH\" && rm -f /tmp/midee-dist.tar.gz"
